version: '3.8' # La mayoría usa versiones 3.x, a menudo más antiguas como 3.1 o 3.3

services:
  db:
    image: postgres:15-alpine # La versión de PostgreSQL también se especifica
    container_name: odoo19-db
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo # Contraseña directamente en el archivo
      - POSTGRES_DB=postgres
    volumes:
      # El mapeo directo a una carpeta local es el método más común que encontrarás
      - ./odoo-db-data:/var/lib/postgresql/data
    networks:
      - odoo-network
    ports:
      - "5433:5433"
    restart: always
  odoo:
    image: odoo:19.0 # La versión de Odoo suele estar fija
    container_name: odoo18_jc_2
    depends_on:
      - db
    ports:
      - "8069:8070"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./enterprise-addons:/mnt/enterprise-addons # Es común ver una carpeta para enterprise
      - ./jorels-odoo-addons:/mnt/extra-addons
      - ./addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
      - odoo-data:/var/lib/odoo
    networks:
      - network_odoo_19
    restart: always

volumes:
  odoo-db-data:
  odoo-data:

networks:
  network_odoo_19:

    # A veces, la configuración se pasa directamente aquí en lugar de en un archivo .conf
    # command: -- --db_host=db --db_user=odoo --db_password=myodoo --addons-path=/mnt/extra-addons,/mnt/enterprise-addons
    
