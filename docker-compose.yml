version: '3.8'

services:
  db19:
    image: postgres:15-alpine
    container_name: odoo19-db
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - ./odoo19-db-data:/var/lib/postgresql/data
    networks:
      - network_odoo_19
    ports:
      - "5433:5432" # Puerto host 5433 para evitar conflicto con v18
    restart: always

  odoo:
    image: odoo:19.0
    container_name: odoo19_jc_1
    depends_on:
      - db19
    ports:
      - "8070:8069" # Puerto host 8070 para pruebas
    environment:
      - HOST=db19
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./enterprise-addons:/mnt/enterprise-19.0
      - ./addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
      - odoo19_data:/var/lib/odoo
    networks:
      - network_odoo_19
    restart: always

volumes:
  odoo19_data:

networks:
  network_odoo_19:
